[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-audit"
version = "1.0.0"
description = "Local-first privacy scanner for files and source trees"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
keywords = ["privacy", "security", "pii", "secrets", "scanner"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
privacy-audit = "privacy_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

name: Bug report
description: Report a reproducible Privacy Audit problem using synthetic data only.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Never paste a real token, private key, personal file, or private customer data into a public issue.

  - type: input
    id: version
    attributes:
      label: Privacy Audit version or commit
      placeholder: "1.0.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
      placeholder: "Ubuntu 24.04, Python 3.12"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Use fake/sample values only.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Area
      options:
        - Detection / rule behavior
        - Redaction
        - File traversal / skipping
        - CLI / exit code
        - JSON output
        - Installation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I used synthetic data and removed real credentials, personal information, and private paths.
          required: true
